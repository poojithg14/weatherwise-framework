server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/weatherwise}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /subscriptions

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

nws:
  api:
    base-url: ${NWS_API_BASE_URL:https://api.weather.gov}
    user-agent: ${NWS_USER_AGENT:WeatherWise/1.0 (contact@weatherwise.dev)}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}

osrm:
  api:
    url: ${OSRM_API_URL:http://router.project-osrm.org}

weatherwise:
  risk:
    proximity-weight: 0.25
    intersection-weight: 0.30
    severity-weight: 0.20
    exposure-weight: 0.15
    escape-weight: 0.10
    nighttime-factor: 1.15
    storm-radius-miles: 50.0
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ingestion:
    poll-interval-ms: 120000
    radius-miles: 75.0
    corridors: "37.09,-84.08;38.04,-84.50;37.75,-84.29"
