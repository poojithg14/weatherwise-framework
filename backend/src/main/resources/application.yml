server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/weatherwise}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  graphql:
    graphiql:
      enabled: ${GRAPHIQL_ENABLED:false}
    websocket:
      path: /subscriptions

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

weatherwise:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  risk-log-flush-ms: ${RISK_LOG_FLUSH_MS:5000}

nws:
  poll-interval-ms: ${NWS_POLL_INTERVAL_MS:60000}
  api:
    base-url: https://api.weather.gov
    user-agent: ${NWS_USER_AGENT:WeatherWise/1.0 (github.com/poojithg14/weatherwise-framework)}

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:5000}

osrm:
  api:
    url: ${OSRM_URL:http://router.project-osrm.org}
