services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: weatherwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weatherwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml:
    build: ./ml
    ports:
      - "5000:5000"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/weatherwise
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-password}
      ML_SERVICE_URL: http://ml:5000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
